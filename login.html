<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOMars — Вхід в акаунт</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;

    background:
        radial-gradient(circle at top, #3a1f14 0%, #1a0d0a 55%, #070403 100%);

    overflow: hidden;
}

/* МАРСІАНСЬКИЙ СВІТ */
body::before {
    content: "";
    position: absolute;

    width: 750px;
    height: 750px;

    background: rgba(255, 90, 40, 0.10);

    border-radius: 50%;

    filter: blur(130px);

    top: -220px;
    right: -160px;

    z-index: -1;
}

/* КАРТКА */
.login-box {
    width: 350px;

    padding: 42px;

    border-radius: 24px;

    background: rgba(15, 8, 6, 0.92);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(255, 106, 42, 0.25);

    box-shadow:
        0 0 25px rgba(255,106,42,0.12),
        0 0 80px rgba(0,0,0,0.6);

    text-align: center;
}

/* ЛОГО */
.logo {
    font-size: 58px;
    font-weight: bold;

    margin-bottom: 28px;

    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 15px rgba(255,106,42,0.25);
}

/* INPUT */
.input-field {
    width: 100%;

    padding: 14px;

    margin: 10px 0;

    border-radius: 15px;

    border: 1px solid rgba(255,106,42,0.18);

    background: rgba(255,255,255,0.04);

    color: white;

    font-size: 15px;

    outline: none;

    box-sizing: border-box;

    transition: 0.25s;
}

.input-field::placeholder {
    color: #ffb39a;
}

.input-field:focus {
    border-color: #ff6a2a;

    box-shadow: 0 0 15px rgba(255,106,42,0.25);

    transform: scale(1.02);
}

/* BUTTON */
.login-btn {
    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    color: black;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow: 0 0 18px rgba(255,106,42,0.2);
}

.login-btn:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow: 0 0 25px rgba(255,106,42,0.4);
}

.login-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* LINKS */
.small-link {
    display: block;

    margin-top: 15px;

    color: #ff9b6a;

    text-decoration: none;

    font-size: 14px;

    transition: 0.2s;
}

.small-link:hover {
    color: #ff6a2a;
    text-shadow: 0 0 10px rgba(255,106,42,0.35);
}
</style>
</head>

<body>

<div class="login-box">
    <div class="logo">BOMars</div>

    <form id="loginForm">
        <input type="email" id="email" class="input-field" placeholder="Електронна пошта" required>
        <input type="password" id="pass" class="input-field" placeholder="Пароль" required>

        <button type="submit" id="submitBtn" class="login-btn">Увійти</button>
    </form>

    <a href="#" class="small-link">Забули пароль?</a>
    <a href="register.html" class="small-link">Створити акаунт</a>
</div>

<script>
const SUPABASE_URL = 'https://kzfmlkskcovenuoftorm.supabase.co'.trim();
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6Zm1sa3NrY292ZW51b2Z0b3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NjU0MTMsImV4cCI6MjA4ODQ0MTQxM30.o1N2biSorW85m_mlpAxndmWlLi0d_49WqBLtjxTNGKk'.trim();

const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginForm = document.querySelector("#loginForm");
const submitBtn = document.querySelector("#submitBtn");

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.querySelector("#email").value;
    const password = document.querySelector("#pass").value;

    submitBtn.innerText = "Вхід...";
    submitBtn.disabled = true;

    const { data, error } = await _supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        alert("Помилка входу: " + error.message);
        submitBtn.innerText = "Увійти";
        submitBtn.disabled = false;
    } else {
        window.location.href = "page.html";
    }
});
</script>

</body>
</html>
