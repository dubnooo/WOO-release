<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOMars — Повідомлення з Ареско</title>
<link rel="stylesheet" href="style.css">

<style>


body {
    font-family: Arial;
    margin: 0;
    color: white;

    background:
        radial-gradient(circle at top, #2a1a12 0%, #120a08 50%, #050403 100%);

    overflow: hidden;
}


body::before {
    content: "";
    position: fixed;

    width: 800px;
    height: 800px;

    background: rgba(255, 90, 40, 0.10);

    border-radius: 50%;

    filter: blur(140px);

    top: -260px;
    right: -180px;

    z-index: -1;
}

body::after {
    content: "";
    position: fixed;

    width: 600px;
    height: 600px;

    background: rgba(66,255,123,0.06);

    border-radius: 50%;

    filter: blur(140px);

    bottom: -220px;
    left: -160px;

    z-index: -1;
}


.main {
    padding: 20px;
}


.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 200px;

    background: rgba(10, 8, 6, 0.95);

    border-right: 1px solid rgba(255,90,40,0.2);

    padding-top: 20px;
}

.sidebar .logo {
    color: #ff6a2a;
    font-size: 28px;
    text-align: center;
    margin-bottom: 20px;
}

.menu-item {
    display: block;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    font-size: 14px;
}

.menu-item:hover,
.menu-item.active {
    background: rgba(255,90,40,0.2);
}


.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 15px;

    padding: 12px 16px;

    border-radius: 18px;

    background: rgba(255,255,255,0.04);

    border: 1px solid rgba(255,120,60,0.25);

    backdrop-filter: blur(10px);

    box-shadow: 0 0 25px rgba(255,90,40,0.12);
}


.chat-header img {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #ff6a2a;

    box-shadow: 0 0 18px rgba(255,90,40,0.35);
}


.chat-box {
    background: rgba(10, 8, 6, 0.92);

    border-radius: 20px;

    padding: 15px;

    height: 400px;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    border: 1px solid rgba(255,90,40,0.15);

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 40px rgba(255,90,40,0.08),
        inset 0 0 25px rgba(255,255,255,0.02);
}


.chat-box::-webkit-scrollbar {
    width: 8px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #ff6a2a;
    border-radius: 10px;
}


@keyframes popIn {
    0% { opacity: 0; transform: scale(0.9) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}


.message {
    padding: 12px 16px;
    margin: 6px 0;

    border-radius: 18px;

    max-width: 72%;

    font-size: 15px;
    line-height: 1.4;

    animation: popIn 0.3s ease-out;
}


.user {
    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);
    color: black;

    align-self: flex-end;

    border-bottom-right-radius: 4px;

    box-shadow: 0 0 18px rgba(255,90,40,0.35);
}


.bot {
    background: linear-gradient(135deg, #1a1f1c, #0f1210);
    color: #d6ffe8;

    align-self: flex-start;

    border: 1px solid rgba(66,255,123,0.18);

    border-bottom-left-radius: 4px;

    box-shadow: 0 0 18px rgba(66,255,123,0.08);
}


.input-box {
    display: flex;
    margin-top: 10px;
    gap: 8px;
}

.input-box input {
    flex: 1;

    padding: 13px 14px;

    border-radius: 14px;

    border: 1px solid rgba(255,120,60,0.18);

    background: rgba(255,255,255,0.04);

    color: white;

    outline: none;

    transition: 0.25s;
}

.input-box input::placeholder {
    color: #ffb39a;
}

.input-box input:focus {
    border-color: #ff6a2a;

    box-shadow: 0 0 15px rgba(255,106,42,0.25);

    transform: scale(1.01);
}


.input-box button {
    padding: 0 18px;

    height: 42px;

    border: none;

    border-radius: 14px;

    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    color: black;

    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;
}

.input-box button:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow: 0 0 22px rgba(255,90,40,0.35);
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">BO</div>
    <a href="page.html" class="menu-item">Головна</a>
    <a href="search.html" class="menu-item">Пошук</a>
    <a href="notifications.html" class="menu-item">Сповіщення</a>
    <a href="messages.html" class="menu-item active">Повідомлення</a>
    <a href="profile.html" class="menu-item">Профіль</a>
    <a href="settings.html" class="menu-item">Налаштування</a>
    <a href="gamehub.html" class="menu-item">Геймерський Хаб</a>
    <a href="musilk.html" class="menu-item">WOtify</a>
</div>

<div class="main">
    <div class="chat-header">
        <img src="https://i0.wp.com/musingsofamiddleagedgeek.blog/wp-content/uploads/2020/03/mv5bmtyzmjdlnzutngzmny00nwu0ltg0njetytazmtkyzwnlywjmxkeyxkfqcgdeqxvyntc3mjuznti40._v1_sx1777_cr001777999_al_.jpg?fit=1200%2C675&ssl=1">
        Переписка з Ареско
    </div>

    <div class="chat-box" id="chat"></div>

    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Напишіть Ареско..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Надіслати</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("messageInput");
    let text = input.value;
    if (text.trim() === "") return;

    let chat = document.getElementById("chat");

    let userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;

    chat.appendChild(userMsg);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    setTimeout(replyMessage, 1000);
}

function replyMessage() {
    let replies = [
        "Пиловий шторм наближається до бази 🌪️",
        "Я зафіксував аномалію біля кратера 🔴",
        "Марс сьогодні неспокійний…",
        "Сигнал із глибин планети отримано 📡",
        "Ареско аналізує атмосферу…"
    ];

    let random = replies[Math.floor(Math.random() * replies.length)];

    let chat = document.getElementById("chat");

    let botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.textContent = random;

    chat.appendChild(botMsg);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
