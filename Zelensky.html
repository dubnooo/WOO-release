<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BO — Повідомлення</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    color: white;

    background:
        radial-gradient(circle at top, #1d3b2a 0%, #0b0f1a 55%, #05070d 100%);

    overflow: hidden;
}

/* СВІТІННЯ */
body::before {
    content: "";
    position: fixed;

    width: 700px;
    height: 700px;

    background: rgba(66,255,123,0.08);

    border-radius: 50%;

    filter: blur(120px);

    top: -250px;
    right: -150px;

    z-index: -1;
}

/* ОСНОВА */
.main {
    padding: 20px;
}

/* HEADER */
.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 15px;

    background: rgba(255,255,255,0.04);

    padding: 12px 16px;

    border-radius: 16px;

    border: 1px solid rgba(66,255,123,0.2);

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 25px rgba(66,255,123,0.12);
}

/* АВАТАР */
.chat-header img {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    border: 2px solid #42ff7b;

    object-fit: cover;

    box-shadow: 0 0 15px rgba(66,255,123,0.35);
}

/* ЧАТ */
.chat-box {
    background: rgba(10, 15, 20, 0.92);

    border-radius: 20px;

    padding: 15px;

    height: 400px;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    border: 1px solid rgba(66,255,123,0.12);

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 30px rgba(66,255,123,0.08),
        inset 0 0 20px rgba(255,255,255,0.02);
}

/* СКРОЛ */
.chat-box::-webkit-scrollbar {
    width: 8px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #1fa85a;
    border-radius: 10px;
}

/* АНІМАЦІЯ */
@keyframes popIn {
    0% {
        opacity: 0;
        transform: scale(0.9) translateY(12px);
    }

    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* ПОВІДОМЛЕННЯ */
.message {
    padding: 12px 16px;

    margin: 6px 0;

    border-radius: 18px;

    max-width: 72%;

    font-size: 15px;

    line-height: 1.5;

    animation: popIn 0.3s ease-out;
}

/* USER */
.user {
    background:
        linear-gradient(135deg, #42ff7b, #1fa85a);

    color: black;

    align-self: flex-end;

    border-bottom-right-radius: 4px;

    box-shadow: 0 0 15px rgba(66,255,123,0.35);
}

/* BOT */
.bot {
    background:
        linear-gradient(135deg, #1b2735, #243447);

    color: white;

    align-self: flex-start;

    border: 1px solid rgba(66,255,123,0.18);

    border-bottom-left-radius: 4px;

    box-shadow: 0 0 15px rgba(66,255,123,0.08);
}

/* INPUT */
.input-box {
    display: flex;

    margin-top: 12px;

    gap: 8px;
}

/* ПОЛЕ */
.input-box input {
    flex: 1;

    padding: 13px 14px;

    border-radius: 14px;

    border: 1px solid rgba(66,255,123,0.15);

    background: rgba(255,255,255,0.04);

    color: white;

    outline: none;

    transition: 0.25s;
}

.input-box input::placeholder {
    color: #89d8a5;
}

.input-box input:focus {
    border-color: #42ff7b;

    box-shadow: 0 0 15px rgba(66,255,123,0.25);

    transform: scale(1.01);
}

/* КНОПКА */
.input-box button {
    padding: 0 18px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(135deg, #42ff7b, #1fa85a);

    color: black;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;
}

/* HOVER */
.input-box button:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 0 18px rgba(66,255,123,0.4);
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">BO</div>
    <a href="page.html" class="menu-item">Головна</a>
    <a href="search.html" class="menu-item">Пошук</a>
    <a href="notifications.html" class="menu-item">Сповіщення</a>
    <a href="messages.html" class="menu-item active">Повідомлення</a>
    <a href="profile.html" class="menu-item">Профіль</a>
    <a href="settings.html" class="menu-item">Налаштування</a>
    <a href="gamehub.html" class="menu-item">Геймерський Хаб</a>
    <a href="musilk.html" class="menu-item">WOtify</a>
</div>

<div class="main">
    <div class="chat-header">
        <img src="https://gordonua.com/img/article/16470/35_big-v1674638227.jpg">
        Переписка з Zelensky_official
    </div>

    <div class="chat-box" id="chat"></div>

    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Напишіть повідомлення..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Надіслати</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("messageInput");
    let text = input.value;

    if (text.trim() === "") return;

    let chat = document.getElementById("chat");

    let userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;

    chat.appendChild(userMessage);
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    setTimeout(replyMessage, 1000);
}

function replyMessage() {
    let replies = [
        "Дякую за повідомлення!",
        "Разом ми сильніші 🇺🇦",
        "Віримо в перемогу!",
        "Підтримуйте одне одного.",
        "Україна обов'язково переможе."
    ];

    let random = replies[Math.floor(Math.random() * replies.length)];
    let chat = document.getElementById("chat");

    let botMessage = document.createElement("div");
    botMessage.className = "message bot";
    botMessage.textContent = random;

    chat.appendChild(botMessage);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
