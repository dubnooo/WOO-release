<style>
   :root {
    --primary: #ff6a2a;
    --secondary: #ff3b1f;
    --dark: #120a08;
    --light: #ffd7c2;
    --glass: rgba(255,255,255,0.04);
}


body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #3a1f14 0%, #1a0d0a 45%, #070403 100%);

    color: #fff;
}


body::before {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: rgba(255, 106, 42, 0.12);
    border-radius: 50%;
    filter: blur(140px);
    top: -250px;
    right: -200px;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    width: 700px;
    height: 700px;
    background: rgba(255, 180, 100, 0.06);
    border-radius: 50%;
    filter: blur(160px);
    bottom: -250px;
    left: -200px;
    z-index: -1;
}


.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100%;

    background: rgba(20, 10, 8, 0.95);
    border-right: 1px solid rgba(255,106,42,0.25);

    padding: 10px;
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 30px;
    color: var(--primary);
    text-shadow: 0 0 15px rgba(255,106,42,0.4);
}


.menu-item {
    display: block;
    padding: 12px;
    font-size: 18px;
    color: #ffd7c2;
    text-decoration: none;
    transition: 0.2s;
    border-radius: 10px;
}

.menu-item:hover,
.menu-item.active {
    background: rgba(255,106,42,0.2);
    color: #ff6a2a;
}


.main {
    margin-left: 250px;
    height: 100vh;
    overflow-y: auto;
}


.header {
    position: sticky;
    top: 0;

    background: rgba(20, 10, 8, 0.95);

    padding: 15px;
    font-size: 22px;
    font-weight: bold;

    border-bottom: 1px solid rgba(255,106,42,0.3);

    backdrop-filter: blur(10px);
}


.post-box {
    padding: 15px;
    border-bottom: 1px solid rgba(255,106,42,0.15);
}

.post-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,106,42,0.2);
    outline: none;

    font-size: 18px;
    color: #fff;

    padding: 10px;
    border-radius: 12px;
}

.post-btn {
    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);
    border: none;

    padding: 10px 18px;
    border-radius: 20px;

    font-size: 15px;
    color: black;

    cursor: pointer;

    margin-top: 10px;

    font-weight: bold;

    transition: 0.2s;
}

.post-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,106,42,0.4);
}


.search-box input {
    width: 90%;
    padding: 12px;
    margin: 15px;

    border-radius: 20px;
    border: 1px solid rgba(255,106,42,0.25);

    background: rgba(255,255,255,0.04);
    color: white;

    font-size: 16px;

    outline: none;
}


.nav-tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.tab-btn {
    padding: 12px 20px;

    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,106,42,0.2);

    color: white;
    cursor: pointer;

    border-radius: 12px;

    transition: 0.3s;
}

.tab-btn.active {
    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);
    color: black;
    transform: scale(1.05);
}


.game-section {
    display: none;

    width: 90%;
    max-width: 900px;

    background: rgba(10, 8, 6, 0.92);

    color: #ffd7c2;

    padding: 30px;

    border-radius: 16px;

    border: 1px solid rgba(255,106,42,0.2);

    backdrop-filter: blur(10px);
}

.game-section.active {
    display: block;
}


#game-area {
    width: 100%;
    height: 300px;

    background: rgba(255,106,42,0.1);

    position: relative;
    overflow: hidden;

    border-radius: 10px;
}

#target {
    width: 60px;
    height: 60px;

    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    position: absolute;

    border-radius: 50%;

    cursor: pointer;

    box-shadow: 0 0 15px rgba(255,106,42,0.4);
}


input {
    width: 100%;
    padding: 10px;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 1px solid rgba(255,106,42,0.2);

    background: rgba(255,255,255,0.04);

    color: white;

    transition: 0.3s;
}

input:focus {
    border-color: #ff6a2a;
    box-shadow: 0 0 15px rgba(255,106,42,0.3);
    outline: none;
}


button {
    padding: 10px 20px;
    cursor: pointer;

    border-radius: 12px;

    border: none;

    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    color: black;

    font-weight: bold;

    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,106,42,0.35);
}
</style>
