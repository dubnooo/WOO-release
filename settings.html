<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOMars — Налаштування</title>

<style>
/* 🌋 МАРСІАНСЬКИЙ СТИЛЬ */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #ffd7c2;

    background:
        radial-gradient(circle at top, #3a1f14 0%, #1a0d0a 45%, #070403 100%);
}

/* пил Марса */
body::before {
    content: "";
    position: fixed;

    width: 800px;
    height: 800px;

    background: rgba(255, 90, 40, 0.12);

    border-radius: 50%;

    filter: blur(140px);

    top: -250px;
    right: -200px;

    z-index: -1;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;

    width: 250px;
    height: 100%;

    background: rgba(20,10,8,0.95);

    border-right: 1px solid rgba(255,106,42,0.25);

    padding: 10px;
}

.logo {
    font-size: 40px;
    font-weight: bold;

    margin-bottom: 30px;

    color: #ff6a2a;

    text-shadow: 0 0 15px rgba(255,106,42,0.4);
}

.menu-item {
    display: block;

    padding: 12px 10px;

    font-size: 18px;

    color: #ffd7c2;

    text-decoration: none;

    border-radius: 10px;

    transition: 0.2s;
}

.menu-item:hover,
.menu-item.active {
    background: rgba(255,106,42,0.2);
    color: #ff6a2a;
}

/* MAIN */
.main {
    margin-left: 250px;
    min-height: 100vh;
}

/* HEADER */
.header {
    position: sticky;
    top: 0;

    padding: 15px;

    font-size: 22px;
    font-weight: bold;

    background: rgba(20,10,8,0.95);

    border-bottom: 1px solid rgba(255,106,42,0.3);

    backdrop-filter: blur(10px);
}

/* SETTINGS */
.settings-container {
    padding: 30px;
    max-width: 700px;
}

/* CARD */
.setting-card {
    background: rgba(10,8,6,0.92);

    border: 1px solid rgba(255,106,42,0.25);

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    backdrop-filter: blur(10px);

    transition: 0.2s;
}

.setting-card:hover {
    transform: translateY(-2px);

    box-shadow: 0 0 20px rgba(255,106,42,0.2);
}

.setting-card h3 {
    margin-bottom: 10px;
    color: #ffb39a;
}

/* INPUT */
.setting-card input {
    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border-radius: 12px;

    border: 1px solid rgba(255,106,42,0.2);

    background: rgba(255,255,255,0.04);

    color: white;

    font-size: 16px;

    outline: none;

    transition: 0.2s;
}

.setting-card input:focus {
    border-color: #ff6a2a;

    box-shadow: 0 0 15px rgba(255,106,42,0.25);
}

/* SAVE BUTTON */
.save-btn {
    background: linear-gradient(135deg, #ff6a2a, #ff3b1f);

    border: none;

    padding: 10px 18px;

    border-radius: 20px;

    font-size: 15px;

    font-weight: bold;

    color: black;

    cursor: pointer;

    margin-top: 15px;

    transition: 0.2s;
}

.save-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,106,42,0.35);
}

/* LOGOUT */
.logout-btn {
    background: #ff3b1f;

    border: none;

    padding: 10px 18px;

    border-radius: 20px;

    font-size: 16px;

    color: black;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;

    transition: 0.2s;
}

.logout-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,60,30,0.4);
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">BO</div>
    <a href="page.html" class="menu-item">Головна</a>
    <a href="search.html" class="menu-item">Пошук</a>
    <a href="notifications.html" class="menu-item">Сповіщення</a>
    <a href="messages.html" class="menu-item">Повідомлення</a>
    <a href="profile.html" class="menu-item">Профіль</a>
    <a href="settings.html" class="menu-item active">Налаштування</a>
    <a href="gamehub.html" class="menu-item">Геймерський Хаб</a>
    <a href="musilk.html" class="menu-item">WOtify</a>
</div>

<div class="main">
    <div class="header">Налаштування (Mars System)</div>

    <div class="settings-container">

        <div class="setting-card">
            <h3>Змінити ім’я</h3>
            <input type="text" placeholder="Нове ім'я">
            <button class="save-btn">Зберегти</button>
        </div>

        <div class="setting-card">
            <h3>Змінити Email</h3>
            <input type="email" placeholder="example@email.com">
            <button class="save-btn">Оновити</button>
        </div>

        <div class="setting-card">
            <h3>Змінити пароль</h3>
            <input type="password" placeholder="Новий пароль">
            <button class="save-btn">Змінити</button>
        </div>

        <div class="setting-card">
            <h3 style="color:#ff6a2a;">Вийти з акаунта</h3>
            <button class="logout-btn" onclick="logout()">Вийти</button>
        </div>

    </div>
</div>

<script>
function logout() {
    localStorage.clear();
    alert("Ви вийшли з акаунта");
    window.location.href = "login.html";
}
</script>

</body>
</html>
