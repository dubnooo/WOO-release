<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMars — Реєстрація</title>
    <!-- Підключення Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
    margin: 0;
    padding: 0;
    background:
        radial-gradient(circle at top, #1d3b2a 0%, #0b0f1a 55%, #05070d 100%);
    font-family: Arial, sans-serif;
    color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    overflow: hidden;
}


body::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;
    background: rgba(66,255,123,0.08);
    filter: blur(120px);
    border-radius: 50%;
    top: -200px;
    right: -150px;
}


.login-box {
    position: relative;

    background: rgba(10, 15, 20, 0.92);
    backdrop-filter: blur(12px);

    padding: 40px;
    width: 350px;

    border-radius: 22px;

    border: 1px solid rgba(66,255,123,0.25);

    box-shadow:
        0 0 25px rgba(66,255,123,0.12),
        0 0 80px rgba(0,0,0,0.5);

    text-align: center;

    animation: fadeIn 0.6s ease;
}


.logo {
    font-size: 56px;
    font-weight: bold;
    margin-bottom: 20px;

    background: linear-gradient(135deg, #42ff7b, #7affc1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 15px rgba(66,255,123,0.25);
}


h3 {
    margin-bottom: 20px;
    font-weight: normal;
    color: #a6ffbf;
    letter-spacing: 1px;
}


.input-field {
    width: 100%;
    padding: 14px;

    margin: 10px 0;

    border-radius: 14px;
    border: 1px solid rgba(66,255,123,0.18);

    background: rgba(255,255,255,0.04);

    color: #fff;
    font-size: 15px;

    outline: none;
    box-sizing: border-box;

    transition: 0.25s;
}


.input-field::placeholder {
    color: #7fb994;
}


.input-field:focus {
    border-color: #42ff7b;
    box-shadow: 0 0 15px rgba(66,255,123,0.25);
    transform: scale(1.02);
}


.btn {
    padding: 13px;
    margin-top: 15px;

    border: none;

    color: #000;
    font-size: 15px;
    font-weight: bold;

    border-radius: 14px;

    cursor: pointer;

    transition: 0.25s;
}


#nextBtn {
    background: linear-gradient(135deg, #42ff7b, #1ccf63);
    width: 100%;

    box-shadow: 0 0 15px rgba(66,255,123,0.25);
}


#prevBtn {
    background: rgba(255,255,255,0.08);
    color: white;

    width: 48%;
    display: none;

    border: 1px solid rgba(255,255,255,0.08);
}


.btn:hover {
    transform: translateY(-2px) scale(1.03);
}

#nextBtn:hover {
    box-shadow: 0 0 25px rgba(66,255,123,0.4);
}


.buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}


@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">BO</div>

    <form id="regForm">
        
        <div class="tab">
            <h3>Контакти</h3>
            <input type="email" id="email" class="input-field" placeholder="E-mail" required>
            <input type="password" id="password" class="input-field" placeholder="Пароль" required>
        </div>

        
        <div class="tab" style="display:none;">
            <h3>Про себе</h3>
            <input type="text" id="firstName" class="input-field" placeholder="Ім'я">
            <input type="text" id="lastName" class="input-field" placeholder="Прізвище">
        </div>

        <div class="buttons">
            <button type="button" id="prevBtn" class="btn" onclick="nextPrev(-1)">Назад</button>
            <button type="button" id="nextBtn" class="btn" onclick="nextPrev(1)">Далі</button>
        </div>
    </form>
</div>

<script>

const SUPABASE_URL = 'https://kzfmlkskcovenuoftorm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6Zm1sa3NrY292ZW51b2Z0b3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NjU0MTMsImV4cCI6MjA4ODQ0MTQxM30.o1N2biSorW85m_mlpAxndmWlLi0d_49WqBLtjxTNGKk';


const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

if (!_supabase) {
    console.error("Критична помилка: Бібліотека Supabase не завантажена!");
}

let currentTab = 0;

function nextPrev(n) {
    const tabs = document.getElementsByClassName("tab");
    
   
    const inputs = tabs[currentTab].querySelectorAll("input");
    if (n === 1) {
        let valid = true;
        inputs.forEach(input => {
            if (!input.checkValidity()) {
                input.reportValidity();
                valid = false;
            }
        });
        if (!valid) return false;
    }

   
    if (n === 1 && currentTab === tabs.length - 1) {
        handleSignUp();
        return false;
    }

    
    tabs[currentTab].style.display = "none";
    currentTab += n;
    tabs[currentTab].style.display = "block";

    
    document.getElementById("prevBtn").style.display = currentTab === 0 ? "none" : "inline-block";
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.innerHTML = currentTab === tabs.length - 1 ? "Готово" : "Далі";
    nextBtn.style.width = currentTab === 0 ? "100%" : "48%";
}

async function handleSignUp() {
    if (!_supabase) {
        alert("Помилка: Спробуйте оновити сторінку, база даних не підключена.");
        return;
    }

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;

    const nextBtn = document.getElementById("nextBtn");
    const originalText = nextBtn.innerText;
    nextBtn.innerText = "Обробка...";
    nextBtn.disabled = true;

    try {
        const { data, error } = await _supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { first_name: firstName, last_name: lastName }
            }
        });

        if (error) throw error;

        alert('Лист для підтвердження надіслано на вашу пошту!');
        location.reload();
    } catch (err) {
        alert('Помилка реєстрації: ' + err.message);
        nextBtn.innerText = originalText;
        nextBtn.disabled = false;
    }
}


</script>
</body>
</html>
